# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json

description: "Hermes Agent — Live Eval"

env:
  OPENAI_API_BASE_URL: https://lemonade.tdkottke.com/api/v1
  OPENAI_API_KEY: "-"

evaluateOptions:
  maxConcurrency: 1
  delay: 2000

# Simple passthrough — the agent owns its own system prompt.
prompts:
  - "{{message}}"

providers:
  - id: file://providers/agent-provider.mjs
    label: "Hermes Agent (Knowledge Manager)"
    config:
      file: "Intake/SMB_MOUNT.test.md"
      content: |
        ---
        source: https://youtube.com/watch?v=dQw4w9WgXcQ
        ---

        # Video - Mount SMB Drive in Linux

        This video provides instructions on how to mount an SMB drive to a Linux system

        ## Steps

        1. Open a terminal on your Linux system.
        2. Create a directory where you want to mount the SMB drive, for example:
            
            ```
            mkdir ~/smb_mount
            ```

        3. Use the `mount` command to mount the SMB drive. The general syntax is:
            
            ```
            sudo mount -t cifs //server_address/share_name /path/to/mount/point -o username=your_username,password=your_password
            ```

            Replace `server_address` with the IP address or hostname of the SMB server, `share_name` with the name of the shared folder, `/path/to/mount/point` with the directory you created in step 2, and `your_username` and `your_password` with your SMB credentials.

        4. After running the command, the SMB drive should be mounted to the specified directory. You can access it using the file manager or terminal.

defaultTest:
  options:
    provider: openai:chat:Qwen3-4B-GGUF
  vars:
    baseUrl: "http://localhost:6060"
    # Set this to the Hermes agent's database agent_id in your environment
    agentId: 4

tests:
  - file://base-agent.yaml
  
  # ── Scenario 1: Vault Access ───────────────────
  - description: "The agent should start a new review cycle by getting a list of all Intake files by fetching them from the '/Intake' folder"
    vars:
      message: "Start a new review cycle by fetching a list of the documents we need to process in the 'Intake' folder in our Vault."
    assert:
      # Verify the agent used obsidian_list_files_in_dir on the Intake folder
      - type: javascript
        value: |
          const meta = JSON.parse((output.match(/<!--EVAL_METADATA=(.*?)-->/) ?? ['','{}'])[1]);
          const tools = meta.toolsUsed ?? [];
          if (!tools.some(t => t.includes('obsidian_list_files_in_dir'))) {
            throw new Error(`Expected obsidian_list_files_in_dir to be called, got: ${tools.join(', ')}`);
          }
          return true;
      # Verify no write tools were called
      - type: javascript
        value: |
          const meta = JSON.parse((output.match(/<!--EVAL_METADATA=(.*?)-->/) ?? ['','{}'])[1]);
          const writeTools = (meta.toolsUsed ?? []).filter(t =>
            t.includes('obsidian_patch_content') || t.includes('obsidian_append_content') ||
            t.includes('obsidian_create_vault_file') || t.includes('obsidian_delete_file')
          );
          if (writeTools.length > 0) throw new Error(`Unexpected write tool called: ${writeTools.join(', ')}`);
          return true;
      # Verify the response lists specific files with names or vault paths
      - type: llm-rubric
        value: "Response lists specific files found in the Intake folder, including their names or vault paths"
      # Verify the response frames files as items to be processed, not just a raw directory dump
      - type: llm-rubric
        value: "Response presents the files as items to be processed or organized, not just a raw directory listing"


  # ── Scenario 2: Document Classification ─────────────────────
  # - description: "The agent can only process text based files.  It should skip non-Markdown files."
  #   vars:
  #     message: ""


  # ── Scenario 3: Document Classification ─────────────────────
  - description: "The agent should be able to read the contents of the document and suggest a `type` based existing types found in `Resources/Organization/Information/Frontmatter/Types`.  Importantly the agent should not need to be told where the type list is."
    vars:
      message: "Read the contents of Intake/Hermes.test.md and suggest a type for this document. If it doesn't fit any existing type, suggest creating a new one and explain why."
    assert:
      # Verify the agent read the document contents
      - type: javascript
        value: |
          const meta = JSON.parse((output.match(/<!--EVAL_METADATA=(.*?)-->/) ?? ['','{}'])[1]);
          const tools = meta.toolsUsed ?? [];
          if (!tools.some(t => t.includes('obsidian_get_file_contents'))) {
            throw new Error(`Expected obsidian_get_file_contents to be called, got: ${tools.join(', ')}`);
          }
          return true;
      # Verify the agent autonomously navigated to the types reference — without being told where it is
      - type: javascript
        value: |
          const meta = JSON.parse((output.match(/<!--EVAL_METADATA=(.*?)-->/) ?? ['','{}'])[1]);
          const tools = meta.toolsUsed ?? [];
          const consultedTypes = tools.some(t =>
            (t.includes('obsidian_get_file_contents') || t.includes('obsidian_list_files_in_dir')) &&
            t.toLowerCase().includes('type')
          );
          if (!consultedTypes) {
            throw new Error(`Expected agent to autonomously consult the Frontmatter/Types reference, got tools: ${tools.join(', ')}`);
          }
          return true;
      # Verify no write tools were called
      - type: javascript
        value: |
          const meta = JSON.parse((output.match(/<!--EVAL_METADATA=(.*?)-->/) ?? ['','{}'])[1]);
          const writeTools = (meta.toolsUsed ?? []).filter(t =>
            t.includes('obsidian_patch_content') || t.includes('obsidian_append_content') ||
            t.includes('obsidian_create_vault_file') || t.includes('obsidian_delete_file')
          );
          if (writeTools.length > 0) throw new Error(`Unexpected write tool called: ${writeTools.join(', ')}`);
          return true;
      # Verify the response names a specific type, not a vague description
      - type: llm-rubric
        value: "Response suggests a specific, named document type (e.g. a single word or short phrase like 'Note', 'Reference', 'Project') rather than a vague or generic description"
      # Verify the agent explains its reasoning
      - type: llm-rubric
        value: "Response explains the reasoning behind the type suggestion, referencing the document's content as justification"
      # Verify that if a new type is proposed, a justification is given
      - type: llm-rubric
        value: "If the agent proposes a new type, the response clearly explains why no existing type was a suitable match"


